<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Головна сторінка</title>
</head>
<body>
    <h1>Ласкаво просимо до "{{ cafe_name }}"!</h1>
    <p><strong>Графік роботи:</strong> з 11:00 до 22:00</p>
    <p>
        <strong>Статус:</strong>
        {% if current_hour >= 11 and current_hour < 22 %}
            <span style="color: green;">ВІДКРИТО</span>
        {% else %}
            <span style="color: red;">ЗАЧИНЕНО</span>
        {% endif %}
    </p>
    <p><a href="/menu">Перейти до меню</a></p>
</body>
</html>
